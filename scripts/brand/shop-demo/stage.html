<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>DOES Shop Demo</title>
<style>
  @font-face { font-family: "P"; src: url("../../../public/fonts/Pretendard-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "P"; src: url("../../../public/fonts/Pretendard-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "P"; src: url("../../../public/fonts/Pretendard-Black.otf"); font-weight: 900; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #05060d; }
  body { font-family: "P", sans-serif; color: #fff; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(ellipse 60% 75% at 66% 50%, #141a3a 0%, #080a16 62%, #04050a 100%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  #g1 { width: 820px; height: 820px; background: rgba(99,102,241,.34); }
  #g2 { width: 640px; height: 640px; background: rgba(20,184,166,.20); }
  #grid { position: absolute; inset: -200px; opacity: .08;
    background-image: linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
    background-size: 80px 80px; mask-image: radial-gradient(ellipse 55% 60% at 60% 50%, #000 0%, transparent 75%); }

  /* 폰 */
  #phone { position: absolute; left: 1150px; top: 96px; width: 536px; height: 887px; border-radius: 64px; padding: 18px; box-sizing: border-box;
    background: linear-gradient(145deg, #2a2f45, #0d0f1a 55%, #22263a); box-shadow: 0 60px 140px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.08), inset 0 0 0 2px rgba(255,255,255,.06); }
  #screenWrap { position: relative; width: 500px; height: 851px; border-radius: 48px; overflow: hidden; background: #000; }
  #screen { position: absolute; left: 0; top: 0; width: 500px; height: 851px; }
  #notch { display: none; }
  #shade { position: absolute; inset: 0; background: rgba(4,6,14,.0); }
  #done { position: absolute; left: 24px; right: 24px; top: 50%; padding: 34px 28px 30px; border-radius: 30px; text-align: center;
    background: rgba(14,18,36,.92); border: 2px solid rgba(74,222,128,.5); box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 60px rgba(74,222,128,.2); }
  #done .ok { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%; background: #22c55e; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(34,197,94,.6); }
  #done b { display: block; font-weight: 900; font-size: 34px; letter-spacing: -1px; }
  #done span { display: block; margin-top: 10px; font-weight: 500; font-size: 20px; color: #94a3b8; }
  #done .code { margin-top: 20px; font-weight: 900; font-size: 24px; letter-spacing: 2px; color: #bbf7d0; padding: 14px 0; border-radius: 16px; background: rgba(34,197,94,.12); border: 1px solid rgba(74,222,128,.35); }
  #dm { position: absolute; left: 18px; right: 18px; top: 60px; display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 22px;
    background: rgba(30,33,52,.95); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  #dm .av { flex: 0 0 48px; height: 48px; border-radius: 50%; background: #5865f2; display: flex; align-items: center; justify-content: center; }
  #dm b { display: block; font-weight: 900; font-size: 18px; }
  #dm span { display: block; margin-top: 3px; font-weight: 500; font-size: 15px; color: #cbd5e1; }
  #finger { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(255,255,255,.35); border: 3px solid rgba(255,255,255,.85); box-shadow: 0 0 30px rgba(255,255,255,.4); opacity: 0; z-index: 4; }

  /* 왼쪽 설명 */
  #left { position: absolute; left: 150px; top: 0; width: 820px; height: 1080px; }
  .cap { position: absolute; left: 0; top: 50%; width: 820px; transform: translateY(-50%); opacity: 0; }
  .cap .no { display: inline-flex; align-items: center; gap: 14px; font-weight: 700; font-size: 28px; letter-spacing: 6px; color: #a5b4fc; }
  .cap .no i { width: 46px; height: 3px; background: linear-gradient(90deg, #6366f1, #a855f7); border-radius: 2px; }
  .cap h2 { margin: 22px 0 0; font-weight: 900; font-size: 92px; letter-spacing: -3px; line-height: 1.05; }
  .cap p { margin: 26px 0 0; font-weight: 700; font-size: 38px; color: #c7d2fe; line-height: 1.4; }
  .cap .tags { margin-top: 34px; display: flex; gap: 14px; flex-wrap: wrap; }
  .cap .tags span { font-weight: 700; font-size: 26px; padding: 12px 24px; border-radius: 999px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.14); color: #e2e8f0; }
  .grad { background: linear-gradient(90deg, #a5b4fc, #c084fc 50%, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }

  #corner { position: absolute; top: 52px; left: 150px; display: flex; align-items: center; gap: 16px; font-weight: 900; font-size: 36px; }
  #corner img { width: 52px; height: 52px; }
  #url { position: absolute; bottom: 52px; left: 150px; font-weight: 700; font-size: 30px; color: #64748b; }
  #steps { position: absolute; bottom: 58px; left: 520px; display: flex; gap: 10px; }
  #steps i { width: 44px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); }
  #fade { position: absolute; inset: 0; background: #04050a; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="glow" id="g1"></div>
  <div class="glow" id="g2"></div>

  <div id="left"></div>

  <div id="phone">
    <div id="screenWrap">
      <img id="screen" alt="" />
      <div id="notch"></div>
      <div id="shade"></div>
      <div id="dm"><div class="av"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M19.6 5.3A16.6 16.6 0 0 0 15.5 4l-.5 1a15.3 15.3 0 0 0-6 0l-.5-1a16.6 16.6 0 0 0-4.1 1.3C1.8 9.2 1.1 13 1.4 16.7a16.8 16.8 0 0 0 5 2.5l1.1-1.7a10.8 10.8 0 0 1-1.7-.8l.4-.3a11.9 11.9 0 0 0 11.6 0l.4.3c-.5.3-1.1.6-1.7.8l1.1 1.7a16.7 16.7 0 0 0 5-2.5c.4-4.3-.7-8-3-11.4zM8.5 14.5c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg></div>
        <div><b>DOES</b><span>구매하신 계정 코드가 도착했어요</span></div></div>
      <div id="done"><div class="ok"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        <b>구매 완료!</b><span>16자리 코드로 바로 받아요</span><div class="code">DOES-7K2Q-X9M4-TB8R</div></div>
      <div id="finger"></div>
    </div>
  </div>

  <div id="corner"><img src="../../../public/does-mark.png" alt="" />DOES</div>
  <div id="steps"></div>
  <div id="url">doesmc.xyz</div>
  <div id="fade"></div>
</div>
<script>
  const CAPS = [
    { no: "01", title: "DOES 홈", desc: "앱 설치 없이<br/>브라우저에서 바로 시작", tags: ["모바일", "PC", "태블릿"] },
    { no: "02", title: "웹마크", desc: "브라우저에서 바로 들어가는<br/><span class=grad>DOES 마인크래프트 월드</span>", tags: ["메인 광장", "미니게임", "채팅"] },
    { no: "03", title: "상점 둘러보기", desc: "탭 한 번으로<br/>카테고리를 넘겨 봐요", tags: ["마크 계정", "마크 망토", "기타상품"] },
    { no: "04", title: "쓱쓱 스와이프", desc: "넘기면서<br/>마음에 드는 계정 찾기", tags: ["실시간 재고", "가격 한눈에"] },
    { no: "05", title: "상품 상세", desc: "가격 · 망토 · 서버 기록까지<br/>꼼꼼하게 확인", tags: ["Hypixel", "DonutSMP", "보유 망토"] },
    { no: "06", title: "바로구매", desc: "Discord 로그인 한 번이면<br/>바로 결제", tags: ["포인트 결제", "자동 전달"] },
    { no: "07", title: "<span class=grad>즉시 수령</span>", desc: "결제하면 16자리 코드가<br/>DM 으로 바로 와요", tags: ["24시간 자동", "30일 보증"] },
  ];
  const left = document.getElementById("left");
  CAPS.forEach((c) => {
    const d = document.createElement("div");
    d.className = "cap";
    d.innerHTML = `<div class="no"><i></i>STEP ${c.no}</div><h2>${c.title}</h2><p>${c.desc}</p><div class="tags">${c.tags.map((x) => `<span>${x}</span>`).join("")}</div>`;
    left.appendChild(d);
  });
  CAPS.forEach(() => document.getElementById("steps").appendChild(document.createElement("i")));

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeIO = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const $ = (id) => document.getElementById(id);

  /**
   * t: 출력 시각, src: 이번 프레임 화면 파일, info: { cap, capStart, capEnd, total, finishAt, taps:[{t,x,y}] }
   */
  window.renderAt = async function (t, src, info) {
    $("g1").style.transform = `translate(${780 + Math.sin(t * .3) * 140}px, ${-120 + Math.cos(t * .25) * 80}px)`;
    $("g2").style.transform = `translate(${1300 + Math.cos(t * .22) * 160}px, ${520 + Math.sin(t * .28) * 90}px)`;
    $("grid").style.transform = `translate(${(t * 16) % 80}px, ${(t * 9) % 80}px)`;

    const img = $("screen");
    if (src && img.dataset.src !== src) {
      img.src = src;
      img.dataset.src = src;
      await img.decode().catch(() => {});
    }

    // 폰 등장 · 살짝 떠 있는 느낌
    const pin = back(seg(t, 0, .9));
    $("phone").style.transform = `translateY(${(1 - pin) * 120 + Math.sin(t * .8) * 6}px) rotate(${Math.sin(t * .5) * .6}deg)`;
    $("phone").style.opacity = clamp(pin * 1.5);

    // 설명
    [...document.querySelectorAll(".cap")].forEach((el, i) => {
      const c = info.caps[i];
      const vin = ease(seg(t, c.start, c.start + .5));
      const vout = 1 - easeIO(seg(t, c.end - .35, c.end));
      const v = Math.min(vin, i === info.caps.length - 1 ? 1 : vout);
      el.style.opacity = v;
      el.style.transform = `translateY(calc(-50% + ${(1 - vin) * 40}px))`;
      [...el.querySelectorAll(".tags span")].forEach((s, k) => {
        const p = back(seg(t, c.start + .25 + k * .1, c.start + .7 + k * .1));
        s.style.opacity = clamp(p);
        s.style.transform = `translateY(${(1 - p) * 18}px)`;
      });
    });
    [...$("steps").children].forEach((d, i) => {
      const c = info.caps[i];
      const on = t >= c.start;
      d.style.background = on ? "linear-gradient(90deg,#6366f1,#a855f7)" : "rgba(255,255,255,.14)";
      d.style.width = t >= c.start && t < c.end ? "70px" : "44px";
    });

    // 손가락 표시
    const f = $("finger");
    f.style.opacity = 0;
    for (const tap of info.taps) {
      if (tap.kind === "tap") {
        const k = seg(t, tap.t - .35, tap.t + .35);
        if (k > 0 && k < 1) {
          f.style.left = tap.x + "px"; f.style.top = tap.y + "px";
          f.style.opacity = Math.sin(Math.PI * k);
          f.style.transform = `scale(${1 - .25 * Math.sin(Math.PI * seg(t, tap.t - .1, tap.t + .15))})`;
        }
      } else {
        const k = seg(t, tap.t, tap.t + tap.d);
        if (k > 0 && k < 1) {
          const e = easeIO(k);
          f.style.left = tap.x + (tap.x2 - tap.x) * e + "px"; f.style.top = tap.y + (tap.y2 - tap.y) * e + "px";
          f.style.opacity = Math.sin(Math.PI * k) * .95;
          f.style.transform = "scale(.9)";
        }
      }
    }

    // 마지막: 구매 완료 · DM
    const fa = info.finishAt;
    const sh = ease(seg(t, fa, fa + .5));
    $("shade").style.background = `rgba(4,6,14,${.62 * sh})`;
    const dp = back(seg(t, fa + .3, fa + .9));
    $("done").style.transform = `translateY(-50%) scale(${.7 + .3 * dp})`;
    $("done").style.opacity = clamp(dp);
    const mp = back(seg(t, fa + 1.6, fa + 2.2));
    $("dm").style.transform = `translateY(${(1 - mp) * -140}px)`;
    $("dm").style.opacity = clamp(mp);

    $("fade").style.opacity = 1 - ease(seg(t, 0, .5)) + easeIO(seg(t, info.total - .6, info.total));
  };
  window.ready = document.fonts.ready;
</script>
</body>
</html>
