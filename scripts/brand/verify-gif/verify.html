<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>DOES Verify</title>
<style>
  @font-face { font-family: "P"; src: url("../../../public/fonts/Pretendard-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "P"; src: url("../../../public/fonts/Pretendard-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "P"; src: url("../../../public/fonts/Pretendard-Black.otf"); font-weight: 900; }
  html, body { margin: 0; width: 960px; height: 540px; overflow: hidden; background: #05060d; }
  body { font-family: "P", sans-serif; color: #fff; }
  #stage { position: relative; width: 960px; height: 540px; overflow: hidden;
    background: radial-gradient(ellipse 70% 80% at 30% 50%, #121735 0%, #080a16 60%, #04050a 100%); }
  .glow { position: absolute; border-radius: 50%; filter: blur(60px); }
  #g1 { width: 520px; height: 520px; background: rgba(99,102,241,.40); }
  #g2 { width: 420px; height: 420px; background: rgba(34,197,94,.0); }
  #grid { position: absolute; inset: -80px; opacity: .09;
    background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: radial-gradient(ellipse 60% 60% at 35% 50%, #000 0%, transparent 75%); }
  .gem { position: absolute; width: 12px; height: 12px; border-radius: 3px; }

  /* 방패 */
  #shieldWrap { position: absolute; left: 70px; top: 95px; width: 300px; height: 350px; }
  #ring { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 3px solid rgba(74,222,128,.0); }
  #shield { position: absolute; inset: 0; }
  #pedestal { position: absolute; left: 40px; top: 300px; width: 220px; height: 44px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 40%, rgba(165,180,252,.45), rgba(99,102,241,.12) 60%, transparent 72%); }

  /* 오른쪽 */
  #right { position: absolute; left: 420px; top: 78px; width: 500px; }
  #eyebrow { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: 3px; color: #a5b4fc;
    padding: 7px 14px; border-radius: 999px; background: rgba(129,140,248,.12); border: 1px solid rgba(129,140,248,.30); }
  #eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px #4ade80; }
  #title { margin-top: 16px; font-weight: 900; font-size: 64px; letter-spacing: -2px; line-height: 1.05;
    background: linear-gradient(180deg, #fff 0%, #c7d2fe 70%, #a5b4fc 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #sub { margin-top: 10px; font-weight: 500; font-size: 20px; color: #94a3b8; }
  #steps { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; align-items: center; gap: 14px; padding: 11px 16px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
  .step .n { flex: 0 0 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; background: rgba(255,255,255,.08); color: #cbd5e1; }
  .step b { font-weight: 700; font-size: 19px; color: #e2e8f0; }
  .step span { margin-left: auto; font-weight: 500; font-size: 14px; color: #64748b; }
  #btnRow { position: relative; margin-top: 22px; height: 58px; }
  #btn { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 10px; padding: 0 30px; height: 58px; border-radius: 16px; font-weight: 900; font-size: 22px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6); box-shadow: 0 12px 34px rgba(99,102,241,.5); overflow: hidden; }
  #btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%); transform: translateX(var(--sh, -120%)); }
  #ripple { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); }
  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  #toast { position: absolute; left: 220px; bottom: 34px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 13px 22px 13px 14px; border-radius: 999px;
    background: rgba(10,14,30,.78); border: 1px solid rgba(74,222,128,.45); box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 30px rgba(74,222,128,.18); white-space: nowrap; }
  #toast .ok { width: 30px; height: 30px; border-radius: 50%; background: #22c55e; display: flex; align-items: center; justify-content: center; }
  #toast b { font-weight: 900; font-size: 19px; }
  #toast span { font-weight: 500; font-size: 16px; color: #94a3b8; }
  #brand { position: absolute; right: 26px; bottom: 22px; display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; color: rgba(255,255,255,.55); }
  #brand img { width: 24px; height: 24px; opacity: .8; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="glow" id="g1"></div>
  <div class="glow" id="g2"></div>
  <div id="gems"></div>

  <div id="shieldWrap">
    <div id="ring"></div>
    <svg id="shield" viewBox="0 0 300 350">
      <defs>
        <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" id="s0" stop-color="#818cf8" />
          <stop offset="1" id="s1" stop-color="#4338ca" />
        </linearGradient>
        <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="rgba(255,255,255,.55)" />
          <stop offset=".5" stop-color="rgba(255,255,255,.05)" />
          <stop offset="1" stop-color="rgba(255,255,255,0)" />
        </linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="8" /></filter>
      </defs>
      <path id="shadow" d="M150 40 60 76v78c0 66 38 110 90 130 52-20 90-64 90-130V76z" fill="rgba(0,0,0,.45)" filter="url(#soft)" transform="translate(0 18)" />
      <path d="M150 30 56 68v84c0 70 40 116 94 138 54-22 94-68 94-138V68z" fill="url(#sg)" />
      <path d="M150 30 56 68v84c0 70 40 116 94 138 54-22 94-68 94-138V68z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4" />
      <path d="M150 48 72 80v72c0 58 33 98 78 117 45-19 78-59 78-117V80z" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)" stroke-width="2" />
      <path d="M150 30 56 68v84c0 20 3 38 9 54C110 150 170 100 244 92V68z" fill="url(#gl)" opacity=".55" />
      <!-- 자물쇠 → 체크 -->
      <g id="lock">
        <rect x="118" y="148" width="64" height="52" rx="10" fill="#fff" opacity=".95" />
        <path d="M130 148v-14a20 20 0 0 1 40 0v14" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".95" />
        <circle cx="150" cy="172" r="7" fill="#4338ca" />
      </g>
      <path id="check" d="M108 168l30 30 56-62" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div id="pedestal"></div>
  </div>

  <div id="right">
    <div id="eyebrow"><i></i>DOES · VERIFY</div>
    <div id="title">디스코드 인증</div>
    <div id="sub">버튼 한 번이면 모든 채널이 열려요</div>
    <div id="steps">
      <div class="step"><div class="n">1</div><b>아래 「인증하기」 버튼 클릭</b><span>약 1초</span></div>
      <div class="step"><div class="n">2</div><b>디스코드 로그인 · 권한 허용</b><span>안전한 공식 인증</span></div>
      <div class="step"><div class="n">3</div><b>인증 완료 · 채널 입장</b><span>자동 역할 지급</span></div>
    </div>
    <div id="btnRow">
      <div id="btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4.5 3 7.6 7 9 4-1.4 7-4.5 7-9V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>인증하기</div>
      <div id="ripple"></div>
    </div>
  </div>

  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.3 3 6.6 3-1.4-3-6.5H18z" fill="#fff" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round"/></svg>

  <div id="toast"><div class="ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div><b>인증 완료!</b><span>모든 채널이 열렸어요</span></div>
  <div id="brand"><img src="../../../public/does-mark.png" alt="" />DOES</div>
</div>
<script>
  const DURATION = 5;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeIO = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const back = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const mix = (a, b, p) => a + (b - a) * p;
  const hex = (a, b, p) => { const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
    const c = [16, 8, 0].map((s) => Math.round(mix((A >> s) & 255, (B >> s) & 255, p)));
    return `rgb(${c.join(",")})`; };
  const $ = (id) => document.getElementById(id);
  const W = (2 * Math.PI) / DURATION; // 한 바퀴 = 영상 길이 → 끊김 없는 반복

  const GEMS = [[40,60,"#818cf8"],[380,40,"#a78bfa"],[900,70,"#22d3ee"],[30,470,"#8b5cf6"],[360,500,"#6366f1"],[930,300,"#2dd4bf"],[640,30,"#c084fc"]];
  GEMS.forEach(([x, y, c]) => { const d = document.createElement("div"); d.className = "gem"; d.style.background = c; d.style.boxShadow = `0 0 14px ${c}`; $("gems").appendChild(d); });

  const check = $("check");
  const LEN = check.getTotalLength();
  check.style.strokeDasharray = LEN;

  // 버튼 위치 (커서 목표)
  const BTN = { x: 420 + 92, y: 78 + 0 }; // 아래에서 실제 값으로 계산

  window.renderAt = function (t) {
    // 배경 (주기 = DURATION)
    $("g1").style.transform = `translate(${-60 + Math.sin(t * W) * 40}px, ${0 + Math.cos(t * W) * 30}px)`;
    $("grid").style.transform = `translate(${(t / DURATION) * 40}px, ${(t / DURATION) * 40}px)`;
    [...$("gems").children].forEach((g, i) => {
      const [x, y] = GEMS[i];
      g.style.transform = `translate(${x}px, ${y + Math.sin(t * W + i) * 8}px) rotate(${25 + (t / DURATION) * 360 * (i % 2 ? 1 : -1)}deg)`;
      g.style.opacity = .45 + .3 * Math.sin(t * W * 2 + i * 1.3);
    });

    // 구간: 0~1.1 대기 · 1.1~1.7 커서 이동 · 1.75 클릭 · 1.9~2.5 체크 · 2.5~4.2 완료 유지 · 4.2~4.9 원래대로
    const done = seg(t, 1.9, 2.5) * (1 - seg(t, 4.3, 4.85));
    const doneE = easeIO(done);

    // 방패 색: 남색 → 초록
    $("s0").setAttribute("stop-color", hex("#818cf8", "#4ade80", doneE));
    $("s1").setAttribute("stop-color", hex("#4338ca", "#15803d", doneE));
    $("lock").style.opacity = 1 - ease(seg(t, 1.8, 2.05)) * (1 - seg(t, 4.5, 4.85)) - 0;
    $("lock").style.opacity = t < 1.8 || t > 4.85 ? 1 : t < 4.5 ? 1 - ease(seg(t, 1.8, 2.05)) : ease(seg(t, 4.5, 4.85));
    check.style.strokeDashoffset = LEN * (1 - ease(seg(t, 1.95, 2.45)));
    check.style.opacity = 1 - seg(t, 4.3, 4.6);
    const pop = back(seg(t, 1.85, 2.3)) * (1 - easeIO(seg(t, 4.3, 4.85)));
    const bob = Math.sin(t * W) * 6;
    $("shield").style.transform = `translateY(${bob}px) scale(${1 + .08 * Math.sin(Math.PI * seg(t, 1.85, 2.35))}) rotate(${Math.sin(t * W) * 2}deg)`;
    $("pedestal").style.background = `radial-gradient(ellipse at 50% 40%, rgba(${Math.round(mix(165, 74, doneE))},${Math.round(mix(180, 222, doneE))},${Math.round(mix(252, 128, doneE))},.5), rgba(99,102,241,.10) 60%, transparent 72%)`;
    $("g2").style.background = `rgba(34,197,94,${.28 * doneE})`;
    $("g2").style.transform = `translate(${0}px, ${60}px)`;
    // 링 퍼짐
    const rp = seg(t, 1.95, 2.9);
    $("ring").style.transform = `scale(${.6 + rp * .9})`;
    $("ring").style.borderColor = `rgba(74,222,128,${rp > 0 && rp < 1 ? (1 - rp) * .8 : 0})`;

    // 단계 강조
    const active = t < 1.75 || t > 4.85 ? 0 : t < 2.2 ? 1 : 2;
    [...document.querySelectorAll(".step")].forEach((s, i) => {
      const on = i === active;
      const past = i < active;
      s.style.background = on ? "rgba(129,140,248,.14)" : "rgba(255,255,255,.04)";
      s.style.borderColor = on ? (i === 2 ? "rgba(74,222,128,.55)" : "rgba(129,140,248,.55)") : "rgba(255,255,255,.08)";
      const n = s.querySelector(".n");
      n.style.background = past || (on && i === 2) ? "#22c55e" : on ? "#6366f1" : "rgba(255,255,255,.08)";
      n.style.color = past || on ? "#fff" : "#cbd5e1";
      n.textContent = past || (on && i === 2) ? "✓" : String(i + 1);
    });

    // 버튼: 반짝임 · 눌림
    const br = $("btn").getBoundingClientRect();
    const tx = br.left + br.width * .62, ty = br.top + br.height * .55;
    const shine = seg(t, .2, 1.0);
    $("btn").style.setProperty("--sh", `${-120 + shine * 240}%`);
    const press = Math.sin(Math.PI * seg(t, 1.7, 1.9));
    $("btn").style.transform = `scale(${1 - .06 * press + .025 * Math.sin(t * W * 2) * (t < 1.1 ? 1 : 0)})`;
    $("btn").style.boxShadow = `0 12px 34px rgba(99,102,241,${.5 + .2 * press})`;
    const rip = seg(t, 1.75, 2.35);
    $("ripple").style.left = `${tx - $("btnRow").getBoundingClientRect().left - 10}px`;
    $("ripple").style.top = `${ty - $("btnRow").getBoundingClientRect().top - 10}px`;
    $("ripple").style.transform = `scale(${1 + rip * 9})`;
    $("ripple").style.opacity = rip > 0 && rip < 1 ? (1 - rip) * .9 : 0;

    // 커서: 오른쪽 아래에서 들어와 클릭, 완료 후 빠짐
    const inP = easeIO(seg(t, 1.0, 1.65));
    const outP = easeIO(seg(t, 2.6, 3.3));
    const sx = 980, sy = 600;
    const cx = mix(sx, tx, inP) + (tx + 160 - tx) * outP;
    const cy = mix(sy, ty, inP) + (620 - ty) * outP;
    $("cursor").style.transform = `translate(${cx - 4}px, ${cy - 3}px) scale(${1 - .12 * press})`;
    $("cursor").style.opacity = t < 1.0 || t > 3.3 ? 0 : 1;

    // 토스트
    const tp = back(seg(t, 2.25, 2.7)) * (1 - easeIO(seg(t, 4.1, 4.5)));
    $("toast").style.transform = `translate(-50%, ${(1 - tp) * 90}px) scale(${.9 + .1 * clamp(tp)})`;
    $("toast").style.opacity = clamp(tp);
  };
  window.DURATION = DURATION;
  window.renderAt(0);
</script>
</body>
</html>
